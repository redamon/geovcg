<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo Venture Capital Group — Portfolio</title>
  <meta name="description" content="Portfolio companies — Geo VCG traditional venture capital fund template." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.65vw, 1.375rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.1vw, 2rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem; --space-20: 5rem;
      --color-bg: #f6f4ef; --color-surface: #faf9f6; --color-surface-2: #f2efe8;
      --color-border: #d5d0c6; --color-divider: #ddd8cf;
      --color-text: #211f1a; --color-text-muted: #646057; --color-text-faint: #959086;
      --color-text-inverse: #f8f6f1; --color-primary: #1f4b57; --color-primary-hover: #183a44;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.875rem; --radius-xl: 1.1rem;
      --shadow-sm: 0 1px 2px rgba(24,22,18,.05); --shadow-md: 0 10px 28px rgba(24,22,18,.08);
      --content: 1160px; --font-display: 'Source Serif 4', Georgia, serif; --font-body: 'Inter', Arial, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1d1c1a; --color-surface-2: #23211f;
      --color-border: #3d3a36; --color-divider: #2c2a27;
      --color-text: #d3d0ca; --color-text-muted: #aaa59d; --color-text-faint: #7e7971;
      --color-text-inverse: #171614; --color-primary: #7aa4ad; --color-primary-hover: #5f8f99;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.18); --shadow-md: 0 12px 32px rgba(0,0,0,.28);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.65;
      color: var(--color-text);
      background: var(--color-bg);
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }
    .container { width: min(calc(100% - 2rem), var(--content)); margin: 0 auto; }

    /* Header / nav */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--color-bg) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-divider);
    }
    .nav {
      min-height: 144px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: var(--text-sm);
    }
    .brand-mark { width: 34px; height: 34px; color: var(--color-primary); }
    .nav-links {
      display: flex;
      gap: var(--space-5);
      align-items: center;
      font-size: var(--text-sm);
    }
    .nav-links a { color: var(--color-text-muted); }
    .nav-links a:hover { color: var(--color-text); }
    .theme-toggle {
      min-width: 44px;
      min-height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: 9999px;
    }

    /* Main layout */
    main { padding: var(--space-16) 0 var(--space-20); }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-xl);
      letter-spacing: -0.02em;
    }
    p { margin: 0; max-width: 144ch; }
    .section-head { margin-bottom: var(--space-10); }
    .kicker {
      font-size: var(--text-xs);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-faint);
      margin-bottom: var(--space-3);
    }
    .lede {
      margin-top: var(--space-4);
      color: var(--color-text-muted);
    }

    /* Logo grid */
    .logo-grid-wrap {
      padding: var(--space-8);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
    }
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
    }
    .logo-tile {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 2.5rem;
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }
    .logo-tile img {
      width: 216px;
      height: 216px;
      object-fit: contain;
    }
    .logo-caption {
      margin-top: var(--space-3);
      text-align: center;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* Footer */
    .footer {
      padding: var(--space-8) 0 var(--space-12);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      border-top: 1px solid var(--color-divider);
    }

    @media (max-width: 960px) {
      .logo-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
            <a class="brand" href="#top" aria-label="Geo VCG home">
        <svg class="brand-mark" viewBox="0 0 48 48" xmlns="https://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="7" y="7" width="34" height="34" rx="8" stroke="currentColor" stroke-width="2" fill="none" ></rect>
          <text x="24" y="30" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="currentColor" >G</text>
        </svg>
        <span>Geo Venture Capital Group</span>
      </a>
      <nav aria-label="Primary navigation">
        <div class="nav-links">
          <a href="index.html#thesis">Strategy</a>
          <a href="portfolio.html">Portfolio</a>
          <a href="index.html#team">Team</a>
          <a href="index.html#process">Process</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="section-head">
        <div class="kicker">Portfolio</div>
        <h1>Selection of companies we have invested in</h1>
        <p class="lede">
          We have invested in some of the highest-growth category-defining startups in recent years.
        </p>
      </div>

      <div class="logo-grid-wrap">
        <div class="logo-grid" aria-label="Portfolio company logos">
          <figure class="logo-tile">
            <img src="assets/logos/Anthropic.png" alt="Company 1 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Anthropic</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-2.png" alt="Company 2 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 2</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-3.png" alt="Company 3 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 3</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-4.png" alt="Company 4 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 4</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-5.png" alt="Company 5 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 5</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-6.png" alt="Company 6 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 6</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-7.png" alt="Company 7 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 7</figcaption>
          </figure>
          <figure class="logo-tile">
            <img src="assets/logos/company-8.png" alt="Company 8 logo" width="144" height="144" loading="lazy">
            <figcaption class="logo-caption">Company 8</figcaption>
          </figure>
        </div>
      </div>
    </div>
  </main>

<footer class="footer">
    <div class="container">info@geovcg.com</div>
    <br>
    <div class="container">©2026 by Geo VCG. All Rights Reserved. </div>
  </footer>
  
  <script>
    (function () {
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let theme = prefersDark ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);

      function icon(mode) {
        return mode === 'dark'
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }

      toggle.innerHTML = icon(theme);
      toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');

      toggle.addEventListener('click', function () {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
        toggle.innerHTML = icon(theme);
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      });
    })();
  </script>
</body>
</html>
